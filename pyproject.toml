[project]
name = "mothbot"
version = "1.0.15"
description = "Desktop-packaging-friendly Gradio app for Mothbot processing pipelines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "babel==2.17.0",
    "gradio==5.42.0",
    "gradio-client==1.11.1",
    "hdbscan==0.8.40",
    "numpy",
    "open-clip-torch==3.1.0",
    "opencv-python==4.13.0.92",
    "packaging",
    "pandas==2.3.1",
    "piexif==1.1.3",
    "pillow",
    "pystray>=0.19",
    "polars==1.42.0",
    "pybioclip==2.1.3",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "pyyaml==6.0.3",
    "regex==2025.9.1",
    "timm",
    "tqdm==4.67.1",
    "typing-extensions",
    "tzdata==2025.2",
    "rembg[cpu]>=2.0.57",
    "ultralytics==8.4.81",
    "ultralytics-thop==2.0.20",
    "onnxruntime",
    "onnx",
]

[project.optional-dependencies]
cpu = [
    "torch",
    "torchvision",
]
cuda118 = [
    "torch==2.7.1+cu118",
    "torchvision==0.22.1+cu118",
    "onnxruntime-gpu",
]
packaging = [
    "lap>=0.5.12",
    "pyinstaller>=6.10,<7",
]


cuda118-packaging = [
    "torch==2.7.1+cu118",
    "torchvision==0.22.1+cu118",
    "lap>=0.5.12",
    "pyinstaller>=6.10,<7",
]


[project.scripts]
mothbot-local = "ui.local_main:main"
mothbot-desktop = "apps.desktop_main:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["apps", "ui", "pipeline", "core"]
